<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LadywoodLink - Login</title>

    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">LL</div>

        <h1>LadywoodLink</h1>

        <p class="subtitle">
            Cleaner Communities. Smarter Reporting.
        </p>

        <form class="login-form" action="/login" method="POST">

            <div id="error-message"></div>

            <label for="email">Email Address</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
            >

            <label for="password">Password</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="/register">Register here</a>
        </p>

        <a href="/dev-bypass" class="bypass-btn">
            Skip to Dashboard (DEVELOPER) →
        </a>

    </div>

</div>
<div id="google_translate_element" style="display:none;"></div>
<script>
function googleTranslateElementInit() {
    new google.translate.TranslateElement(
        {
            pageLanguage: "en",
            includedLanguages: "en,pl,ar,fa,ur,pa,bn,zh-CN,zh-TW",
            autoDisplay: false
        },
        "google_translate_element"
    );
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="/js/settings.js"></script>

<script>
    const form = document.querySelector('.login-form');
    const errorBox = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';

        const formData = new URLSearchParams(new FormData(form));

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                window.location.href = data.redirect;
            } else {
                errorBox.textContent = data.message;
                errorBox.style.display = 'block';
            }
        } catch (err) {
            errorBox.textContent = "Unable to reach security servers. Please try again.";
            errorBox.style.display = 'block';
        }
    });
</script>

</body>
</html>
