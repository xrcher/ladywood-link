<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LadywoodLink - Recycling</title>

    <script src="https://kit.fontawesome.com/692d4b5a4e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/css/recycling.css">
</head>

<body>

    <div class="dashboard-shell">

        <aside class="sidebar">

            <div class="logo">
                LL
            </div>

            <nav class="nav-icons">
                <a href="/dashboard" data-label="Dashboard"><i class="fa-solid fa-house"></i></a>
                <a href="/recycling" class="active" data-label="Recycling"><i class="fa-solid fa-recycle"></i></a>
                <a href="/bin-collection" data-label="Bin Collection"><i class="fa-regular fa-trash-can"></i></a>
                <a href="/rewards" data-label="Rewards"><i class="fa-solid fa-shop"></i></a>
                <a href="/waste-report" data-label="Waste Report"><i class="fa-solid fa-triangle-exclamation"></i></a>
                <a href="/settings" data-label="Settings"><i class="fa-solid fa-user-gear"></i></a>
                <a href="/logout" class="logout" data-label="Logout">Logout</a>
            </nav>

        </aside>



        <main class="main-content">
            <h1>Recycling</h1>
        
            <div class="recycling-layout">
        
                <div class="recycling-left-column">
        
                    <article class="card-recycling-log">
                        <div class="card-recycling-header">
                            <p class="eyebrow">Recycle Log</p>
                            <h2>Log your Recycling Redemptions here to earn Green Points</h2>
                        </div>
        
                        <form class="recycling-form" id="recyclingForm">
                            <label>
                                How much KG of waste did you recycle? 1KG = 10 points
                                <input 
                                    type="number" 
                                    name="weight" 
                                    min="1" 
                                    step="1" 
                                    placeholder="Enter KG recycled" 
                                    required
                                >
                            </label>
        
                            <label>
                                Location
                                <select name="location" required>
                                    <option value="">Select recycling point</option>
                                    <option value="Green Channel">Green Channel</option>
                                    <option value="Rob Metals">Rob Metals</option>
                                    <option value="Enviro City">Enviro City</option>
                                </select>
                            </label>
        
                            <label>
                                Notes
                                <textarea 
                                    name="notes" 
                                    rows="4" 
                                    placeholder="Add any details"
                                ></textarea>
                            </label>
        
                            <button type="submit">Submit report</button>
                        </form>
                    </article>
        
                    <article class="recycling-history-card">
                        <p class="eyebrow">Recent Activity</p>
                        <h2>Recycling History</h2>
        
                        <div id="recycling-history">
                            <p class="empty-history">No recycling logs yet.</p>
                        </div>
                    </article>
        
                </div>
        
                <article class="recycling-map-card">
                    <div class="recycling-card-map-header">
                        <p class="eyebrow">Recycle Points in Ladywood</p>
                        <h2>Here are the local recycling points in the area of Ladywood</h2>
                        <div id="map"></div>
                    </div>
                </article>
        
            </div>
        </main>

    </div>

<script src="/js/settings.js"></script>
</body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/recmap.js"></script>
<script src="/js/recycling.js"></script>

</html>
