<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | LadywoodLink</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="https://kit.fontawesome.com/692d4b5a4e.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="logo">LL</div>

      <h1>Create Account</h1>
      <p class="subtitle">Join the LadywoodLink community.</p>

      <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name">

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Create a password">

        <label>District Sign-up Code</label>
        <input type="text" placeholder="Enter access code">

        <button type="button" class="primary-btn">Register</button>
      </form>

      <p class="switch-text">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>

      <a href="start.html" class="back-link">← Back</a>
    </section>
  </main>
</body>
</html>
