<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LadywoodLink</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <div class="logo">LL</div>

        <h1>Create Account</h1>
        <p class="subtitle">Join the LadywoodLink community.</p>

        <form action="/register" method="POST">

            <div id="error-message"></div>

            <label>National Insurance Number</label>
            <input type="text" name="nationalInsurance" placeholder="AB123456C" required>

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>

            <button type="submit" class="primary-btn">Register</button>
        </form>

        <p class="switch-text">
            Already have an account?
            <a href="/login">Login here</a>
        </p>

        <a href="/login" class="back-link">← Back</a>
    </section>
</main>

<div id="google_translate_element" style="display:none;"></div>
<script>
function googleTranslateElementInit() {
    new google.translate.TranslateElement(
        {
            pageLanguage: "en",
            includedLanguages: "en,pl,ar,fa,ur,pa,bn,zh-CN,zh-TW",
            autoDisplay: false
        },
        "google_translate_element"
    );
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="/js/settings.js"></script>

<script>
    const form = document.querySelector('form');
    const errorBox = document.getElementById('error-message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';

        const formData = new URLSearchParams(new FormData(form));

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                window.location.href = data.redirect;
            } else {
                errorBox.textContent = data.message;
                errorBox.style.display = 'block';
            }
        } catch (err) {
            errorBox.textContent = "Unable to reach registration servers. Please try again.";
            errorBox.style.display = 'block';
        }
    });
</script>


</body>
</html>
