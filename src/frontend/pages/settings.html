<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LadywoodLink - Settings</title>
    <script src="https://kit.fontawesome.com/692d4b5a4e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/settings.css">
</head>
<body>

<div class="dashboard-shell">

    <aside class="sidebar">

        <div class="logo">
            LL
        </div>

        <nav class="nav-icons">
            <a href="/dashboard" data-label="Dashboard"><i class="fa-solid fa-house"></i></a>
            <a href="/recycling" data-label="Recycling"><i class="fa-solid fa-recycle"></i></a>
            <a href="/bin-collection" data-label="Bin Collection"><i class="fa-regular fa-trash-can"></i></a>
            <a href="/rewards" data-label="Rewards"><i class="fa-solid fa-shop"></i></a>
            <a href="/waste-report" data-label="Waste Report"><i class="fa-solid fa-triangle-exclamation"></i></a>
            <a href="/settings" class="active" data-label="Settings"><i class="fa-solid fa-user-gear"></i></a>
            <a href="/logout" class="logout" data-label="Logout">Logout</a>
        </nav>

    </aside>

    <main class="main-content settings-content">
        <h1>Settings</h1>
        
        <div class = "account-information">
             <h2>Account Information</h2>

             <div class="settings-field">
                <label>Email</label>
                <p id="user-email">syl********@gmail.com</p>
             </div>

             <div class="settings-field">
                <label>Password</label>
                <p>********</p>
             </div>

             <div class="settings-field">
                <label for="new-password">Change Password</label>
                <input type="password" id="new-password" placeholder="Enter new password">
             </div>

             <div class="settings-field">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm new passord">
             </div>

             <button id="save-password-btn">Save New Password</button>

        </div>

        <div class="accessibility">
            <h2>Accessibility</h2>

            <div class="ac">
                <label for="language-select">Language</label>
                <select id="language-select">
                    <option value="EN">English</option>
                    <option value="PL">Polish</option>
                    <option value="AR">Arabic</option>
                    <option value="zh-mandarin">Chinese - Madarin</option>
                    <option value="zh-cantonese">Chinese - Cantonese</option>
                    <option value="fa">Farsi</option>
                    <option value="ur">Urdu</option>
                    <option value="pa">Punjabi</option>
                    <option value="bn">Bengali</option>
                </select>
            </div>

            <div class="ac">
                <label for="font-select">Readable Font</label>
                <select id="font-select">
                    <option value="arial">Arial</option>
                    <option value="comic-sans">Comic Sans</option>
                    <option value="verdana">Verdana</option>
                    <option value="tahoma">Tahoma</option>
                    <option value="century-gothic">Century Gothic</option>
                    <option value="trebuchet">Trebuchet MS</option>
                </select>
            </div>

            <div class="ac">
                <label for="colour-mode">Colour Blind Mode</label>
                <select id="colour-mode">
                    <option value="none">None</option>
                    <option value="red-green">Red-Green Support</option>
                    <option value="blue-yellow">Blue-Yellow Support</option>
                    <option value="high-contrast">High Contrast</option>
                </select>
            </div>

            <div class="ac">
                <label for="theme-mode">Theme</label>
                <select id="theme-mode">
                    <option value="light">Light Mode</option>
                    <option value="dark">Dark Mode</option>
                </select>
            </div>

            <button id="save-accessibility-btn">Save Accessibility Settings</button>
        </div>

        <footer class="footer">
            © 2026 LadywoodLink · Community waste, sanitation and water alerts
      </footer>
      
    </main>

</div>

<script src="/js/settings.js"></script>

</body>
</html>
